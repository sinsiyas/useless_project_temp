<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlinkAI - Blink Counter</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #07142e, #101d4d);
            color: white;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding-top: 35px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            color: #bfc9ff;
        }

        .video-box {
            position: relative;
            width: 720px;
            max-width: 100%;
            margin: auto;
            background: black;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        #video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        #canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        .status {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 25px;
            font-weight: bold;
            color: #00ff66;
            text-shadow: 2px 2px 5px black;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255,255,255,0.12);
            border-radius: 18px;
            padding: 20px 40px;
            min-width: 190px;
        }

        .card h2 {
            font-size: 18px;
            color: #cbd3ff;
            margin-bottom: 10px;
        }

        .value {
            font-size: 38px;
            font-weight: bold;
        }

        button {
            margin-top: 30px;
            padding: 15px 35px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #startBtn {
            background: #00e676;
            color: #061b12;
        }

        #stopBtn {
            background: #ff5252;
            color: white;
            margin-left: 10px;
        }

        button:hover {
            opacity: 0.85;
        }

        #message {
            margin-top: 15px;
            color: #ffd54f;
            font-size: 16px;
        }

    </style>
</head>


<body>

    <div class="container">

        <h1>👁️ BlinkAI</h1>

        <div class="subtitle">
            The Completely Wellness Blink Counter
        </div>


        <div class="video-box">

            <video id="video" autoplay playsinline></video>

            <canvas id="canvas"></canvas>

            <div class="status" id="faceStatus">
                FACE NOT DETECTED
            </div>

        </div>


        <div class="stats">

            <div class="card">
                <h2>👁️ Blinks</h2>
                <div class="value" id="blinkCount">
                    0
                </div>
            </div>


            <div class="card">
                <h2>⏱️ Time</h2>
                <div class="value" id="timer">
                    00:00
                </div>
            </div>


            <div class="card">
                <h2>📊 Blink Rate</h2>
                <div class="value" id="blinkRate">
                    0/min
                </div>
            </div>

        </div>


        <button id="startBtn">
            ▶ START
        </button>

        <button id="stopBtn">
            ■ STOP
        </button>


        <div id="message">
            Press START to begin.
        </div>

    </div>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

const blinkCountText = document.getElementById("blinkCount");
const timerText = document.getElementById("timer");
const blinkRateText = document.getElementById("blinkRate");

const faceStatus = document.getElementById("faceStatus");
const message = document.getElementById("message");


let blinkCount = 0;

let running = false;

let startTime = 0;

let timerInterval = null;

let camera = null;

let eyeClosed = false;

let lastBlinkTime = 0;


/* =========================
   DISTANCE FUNCTION
========================= */

function distance(p1, p2) {

    const x = p1.x - p2.x;
    const y = p1.y - p2.y;

    return Math.sqrt(x * x + y * y);
}


/* =========================
   EAR FUNCTION
========================= */

function calculateEAR(a, b, c, d, e, f) {

    const vertical1 = distance(b, f);

    const vertical2 = distance(c, e);

    const horizontal = distance(a, d);

    return (vertical1 + vertical2) / (2 * horizontal);
}


/* =========================
   MEDIAPIPE FACE MESH
========================= */

const faceMesh = new FaceMesh({

    locateFile: function(file) {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;

    }

});


faceMesh.setOptions({

    maxNumFaces: 1,

    refineLandmarks: true,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


faceMesh.onResults(function(results) {

    if (!running) {
        return;
    }


    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (
        results.multiFaceLandmarks &&
        results.multiFaceLandmarks.length > 0
    ) {

        faceStatus.innerText = "FACE DETECTED";

        faceStatus.style.color = "#00ff66";


        const landmarks =
            results.multiFaceLandmarks[0];


        /*
        LEFT EYE
        */

        const leftEAR = calculateEAR(

            landmarks[33],
            landmarks[160],
            landmarks[158],
            landmarks[133],
            landmarks[153],
            landmarks[144]

        );


        /*
        RIGHT EYE
        */

        const rightEAR = calculateEAR(

            landmarks[362],
            landmarks[385],
            landmarks[387],
            landmarks[263],
            landmarks[373],
            landmarks[380]

        );


        const ear =
            (leftEAR + rightEAR) / 2;


        /*
        DISPLAY EAR
        */

        ctx.font = "bold 22px Arial";

        ctx.fillStyle = "#00ff66";

        ctx.fillText(
            "EAR: " + ear.toFixed(2),
            20,
            55
        );


        /*
        BLINK DETECTION
        */

        const threshold = 0.21;

        const currentTime = Date.now();


        if (ear < threshold && !eyeClosed) {

            eyeClosed = true;

        }


        if (
            ear >= threshold &&
            eyeClosed
        ) {

            eyeClosed = false;


            /*
            Prevent double counting
            */

            if (
                currentTime - lastBlinkTime > 300
            ) {

                blinkCount++;

                lastBlinkTime = currentTime;

                blinkCountText.innerText =
                    blinkCount;

                updateBlinkRate();

            }

        }

    }

    else {

        faceStatus.innerText =
            "FACE NOT DETECTED";

        faceStatus.style.color =
            "#ff5252";

    }

});


/* =========================
   START CAMERA
========================= */

startBtn.addEventListener("click", async function() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: true,

                audio: false

            });


        video.srcObject = stream;


        running = true;

        blinkCount = 0;

        eyeClosed = false;

        lastBlinkTime = 0;


        blinkCountText.innerText = "0";

        blinkRateText.innerText = "0/min";


        startTime = Date.now();


        message.innerText =
            "Camera started. Look at the camera and blink normally.";


        timerInterval =
            setInterval(updateTimer, 1000);


        camera = new Camera(video, {

            onFrame: async function() {

                await faceMesh.send({
                    image: video
                });

            },

            width: 720,

            height: 480

        });


        camera.start();


    }

    catch (error) {

        console.error(error);

        message.innerText =
            "Camera permission was denied or camera is unavailable.";

    }

});


/* =========================
   STOP CAMERA
========================= */

stopBtn.addEventListener("click", function() {

    running = false;


    clearInterval(timerInterval);


    if (video.srcObject) {

        const tracks =
            video.srcObject.getTracks();

        tracks.forEach(function(track) {

            track.stop();

        });

        video.srcObject = null;

    }


    if (camera) {

        camera.stop();

        camera = null;

    }


    message.innerText =
        "Session stopped.";

});


/* =========================
   TIMER
========================= */

function updateTimer() {

    if (!running) {
        return;
    }


    const elapsed =
        Math.floor(
            (Date.now() - startTime) / 1000
        );


    const minutes =
        Math.floor(elapsed / 60);


    const seconds =
        elapsed % 60;


    timerText.innerText =
        String(minutes).padStart(2, "0")
        + ":"
        +
        String(seconds).padStart(2, "0");


    updateBlinkRate();

}


/* =========================
   BLINK RATE
========================= */

function updateBlinkRate() {

    const elapsedSeconds =
        (Date.now() - startTime) / 1000;


    if (elapsedSeconds < 5) {

        blinkRateText.innerText =
            "0/min";

        return;

    }


    const rate =
        blinkCount /
        elapsedSeconds *
        60;


    blinkRateText.innerText =
        Math.round(rate) + "/min";

}

</script>

</body>

</html>
